name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board-service
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: board-service/pom.xml

      - name: mvn test
        run: mvn -B test

  frontend:
    name: Frontend (Angular + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-web
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taskflow-web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: ng test
        run: npx ng test --no-watch

      - name: ng build
        run: npx ng build
